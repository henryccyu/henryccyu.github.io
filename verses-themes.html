<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經文背誦小幫手</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --verse-bg: #eef2f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        /* 控制按鈕列樣式 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid #cbd5e1;
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* 組別區塊樣式 */
        .section-container {
            margin-bottom: 20px;
        }

        .section-header {
            color: var(--primary-color);
            background-color: #e2e8f0;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            margin: 0 0 10px 0;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            user-select: none;
            transition: background-color 0.2s;
        }

        .section-header:hover {
            background-color: #cbd5e1;
        }

        .section-header::after {
            content: '▼';
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        .section-container.collapsed .section-header::after {
            transform: rotate(-90deg);
        }

        /* 經節清單容器動畫 */
        .section-body {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .section-container.collapsed .section-body {
            max-height: 0;
            opacity: 0;
        }

        /* 單張經文卡片 */
        .verse-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .verse-header {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-weight: 600;
            color: var(--primary-color);
        }

        .verse-header:hover {
            background-color: #f1f4f8;
        }

        .verse-header::after {
            content: '+';
            font-size: 1.2rem;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .verse-card.active .verse-header::after {
            transform: rotate(45deg);
        }

        .verse-content {
            max-height: 0;
            overflow: hidden;
            background-color: var(--verse-bg);
            padding: 0 20px;
            transition: max-height 0.3s ease, padding 0.3s ease;
            font-size: 1.05rem;
            color: #444;
            white-space: pre-line;
        }

        .verse-card.active .verse-content {
            max-height: 500px;
            padding: 15px 20px 20px 20px;
            border-top: 1px solid #e1e8ed;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>聖經經文</h1>
            <p>點擊組別標題可摺疊/展開大組，點擊經節可查看內容</p>
        </header>

        <div class="controls">
            <button class="btn" id="expandAllBtn">全部展開</button>
            <button class="btn" id="collapseAllBtn">全部收合</button>
        </div>

        <div id="app"></div>
    </div>

    <script>
        const bibleData = [
            {
                group: "Self Control",
                verses: [
                    { ref: "诗篇 32:9", content: "你不可像那无知的骡马，必用嚼环辔头勒住它；不然，就不能驯服。" },
                    { ref: "箴言 25:28", content: "人不制伏自己的心，好像毁坏的城邑没有墙垣。" }
                ]
            },
            {
                group: "應許 - 平安",
                verses: [
                    { ref: "腓立比书 4:6-7", content: "应当一无挂虑，只要凡事藉着祷告、祈求，和感谢，将你们所要的告诉神。神那出人意外的平安必在基督耶稣里保守你们的心怀意念。" },
                    { ref: "约翰福音 14:27", content: "我留下平安给你们；我将我的平安赐给你们。我所赐的，不像世人所赐的。你们心里不要忧愁，也不要胆怯。"},
                    { ref: "马太福音 11:28", content: "凡劳苦担重担的人可以到我这里来，我就使你们得安息。" },
                    { ref: "以赛亚书 41:10", content: "你不要害怕，因为我与你同在；不要惊惶，因为我是你的神。我必坚固你，我必帮助你；我必用我公义的右手扶持你。"},
                    { ref: "以赛亚书 41:13", content: "因为我耶和华你的神必搀扶你的右手，对你说：不要害怕！我必帮助你。" },
                    { ref: "以赛亚书 40:31", content: "但那等候耶和华的必从新得力。他们必如鹰展翅上腾；他们奔跑却不困倦，行走却不疲乏。"},
                    { ref: "诗篇 46:1-2", content: "神是我们的避难所，是我们的力量，是在患难中随时的帮助。所以，地虽改变，山虽摇动到海心，我们也不害怕。" },
                    { ref: "提摩太后书 1:7", content:"因为神赐给我们，不是胆怯的心，乃是刚强、仁爱、谨守的心。"},
                    { ref: "申命记 31:8", content:"耶和华必在你前面行；他必与你同在，必不撇下你，也不丢弃你。不要惧怕，也不要惊惶。"},
                    { ref: "耶利米书 29:11", content:"耶和华说：我知道我向你们所怀的意念是赐平安的意念，不是降灾祸的意念，要叫你们末后有指望。" },
                    { ref: "箴言 3:5-6", content: "你要专心仰赖耶和华，不可倚靠自己的聪明，在你一切所行的事上都要认定他，他必指引你的路。" },
                    { ref: "诗篇 34:18", content: "耶和华靠近伤心的人，拯救灵性痛悔的人。" }
                ]
            },
            {
                group: "但以理的祈禱",
                verses: [
                    { content: "4. ...主啊，大而可畏的神，向愛主守主誡命的人守約施慈愛。 \n5 我們犯罪作孽，行惡叛逆，偏離你的誡命、典章， \n6 沒有聽從你僕人眾先知奉你名向我們君王、首領、列祖和國中一切百姓所說的話。" },
                    { content: "7 主啊，你是公義的，我們是臉上蒙羞的，因我們猶大人和耶路撒冷的居民，並以色列眾人——或在近處或在遠處被你趕到各國的人，都得罪了你，正如今日一樣。 \n 8 主啊，我們和我們的君王、首領、列祖因得罪了你，就都臉上蒙羞。" },
                    { content: "9 主我們的神是憐憫饒恕人的，我們卻違背了他， \n10 也沒有聽從耶和華我們神的話，沒有遵行他藉僕人眾先知向我們所陳明的律法。 \n11 以色列眾人都犯了你的律法，偏行，不聽從你的話，因此在你僕人摩西律法上所寫的咒詛和誓言都傾在我們身上，因我們得罪了神。" },
                    { content: "12 他使大災禍臨到我們，成就了警戒我們和審判我們官長的話。原來在普天之下，未曾行過像在耶路撒冷所行的。 \n13 這一切災禍臨到我們身上，是照摩西律法上所寫的，我們卻沒有求耶和華我們神的恩典，使我們回頭離開罪孽，明白你的真理。 \n14 所以耶和華留意使這災禍臨到我們身上，因為耶和華我們的神在他所行的事上都是公義，我們並沒有聽從他的話。" },
                    { content: "15 主我們的神啊，你曾用大能的手領你的子民出埃及地，使自己得了名，正如今日一樣。我們犯了罪，作了惡。" },
                    { content: "16 主啊，求你按你的大仁大義，使你的怒氣和憤怒轉離你的城耶路撒冷，就是你的聖山。耶路撒冷和你的子民，因我們的罪惡和我們列祖的罪孽被四圍的人羞辱。" },
                    { content: "17 我們的神啊，現在求你垂聽僕人的祈禱懇求，為自己使臉光照你荒涼的聖所。 \n18 我的神啊，求你側耳而聽，睜眼而看，眷顧我們荒涼之地和稱為你名下的城。我們在你面前懇求，原不是因自己的義，乃因你的大憐憫。 \n19 求主垂聽，求主赦免，求主應允而行，為你自己不要遲延，我的神啊，因這城和這民都是稱為你名下的。" }
                ]
            },
            {
                group: "哈拿的禱告",
                verses: [
                    { content: "1 我的心因耶和華快樂，我的角因耶和華高舉，我的口向仇敵張開，我因耶和華的救恩歡欣！" },
                    { content: "2 只有耶和華為聖，除他以外沒有可比的，也沒有磐石像我們的神。" },
                    { content: "3 人不要誇口說驕傲的話，也不要出狂妄的言語；因耶和華是大有智識的神，人的行為被他衡量。" },
                    { content: "4 勇士的弓都已折斷，跌倒的人以力量束腰。 \n5 素來飽足的，反做用人求食；飢餓的，再不飢餓。不生育的，生了七個兒子；多有兒女的，反倒衰微。" },
                    { content: "6 耶和華使人死，也使人活；使人下陰間，也使人往上升。 \n7 他使人貧窮，也使人富足；使人卑微，也使人高貴。 \n8 他從灰塵裡抬舉貧寒人，從糞堆中提拔窮乏人，使他們與王子同坐，得著榮耀的座位。地的柱子屬於耶和華，他將世界立在其上。" },
                    { content: "9 他必保護聖民的腳步，使惡人在黑暗中寂然不動，人都不能靠力量得勝。 \n10 與耶和華爭競的必被打碎，耶和華必從天上以雷攻擊他，必審判地極的人；將力量賜予所立的王，高舉受膏者的角。" }
                ]
            },
            {
                group: "以弗所書",
                verses: [
                    { content: "17 求我們主耶穌基督的神、榮耀的父，將那賜人智慧和啟示的靈賞給你們，使你們真知道他。\n18 並且照明你們心中的眼睛，使你們知道他的恩召有何等指望，他在聖徒中得的基業有何等豐盛的榮耀；" },
                    { content: "19 並知道他向我們這信的人所顯的能力是何等浩大，\n20 就是照他在基督身上所運行的大能大力，使他從死裡復活，叫他在天上坐在自己的右邊，\n21 遠超過一切執政的、掌權的、有能的、主治的和一切有名的，不但是今世的，連來世的也都超過了；\n22 又將萬有服在他的腳下，使他為教會做萬有之首。" }
                ]
            }
        ];

        const appElement = document.getElementById('app');

        // 渲染畫面
        bibleData.forEach(section => {
            // 包覆每一組的外層容器
            const sectionContainer = document.createElement('div');
            sectionContainer.className = 'section-container';

            // 組別大標題
            const sectionHeader = document.createElement('h2');
            sectionHeader.className = 'section-header';
            sectionHeader.innerText = section.group;

            // 實際裝經節的容器
            const sectionBody = document.createElement('div');
            sectionBody.className = 'section-body';

            // 點擊組別標題以折疊/展開該組
            sectionHeader.addEventListener('click', () => {
                sectionContainer.classList.toggle('collapsed');
            });

            // 建立該組底下的所有經節卡片
            section.verses.forEach(item => {
                const card = document.createElement('div');
                card.className = 'verse-card';

                const header = document.createElement('div');
                header.className = 'verse-header';
                header.innerText = item.ref;

                const content = document.createElement('div');
                content.className = 'verse-content';
                content.innerText = item.content;

                // 點擊經節：切換展開/收合經文內容
                header.addEventListener('click', (e) => {
                    e.stopPropagation(); // 避免觸發父層的折疊事件
                    card.classList.toggle('active');
                });

                card.appendChild(header);
                card.appendChild(content);
                sectionBody.appendChild(card);
            });

            sectionContainer.appendChild(sectionHeader);
            sectionContainer.appendChild(sectionBody);
            appElement.appendChild(sectionContainer);
        });

        // 「全部展開」與「全部收合」按鈕功能
        document.getElementById('expandAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.section-container').forEach(el => {
                el.classList.remove('collapsed');
            });
        });

        document.getElementById('collapseAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.section-container').forEach(el => {
                el.classList.add('collapsed');
            });
        });
    </script>
</body>
</html>
