<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經文背誦小幫手</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --verse-bg: #eef2f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        /* 控制按鈕列樣式 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid #cbd5e1;
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* 組別區塊樣式 */
        .section-container {
            margin-bottom: 20px;
        }

        .section-header {
            color: var(--primary-color);
            background-color: #e2e8f0;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            margin: 0 0 10px 0;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            user-select: none;
            transition: background-color 0.2s;
        }

        .section-header:hover {
            background-color: #cbd5e1;
        }

        .section-header::after {
            content: '▼';
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        .section-container.collapsed .section-header::after {
            transform: rotate(-90deg);
        }

        /* 經節清單容器動畫 */
        .section-body {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .section-container.collapsed .section-body {
            max-height: 0;
            opacity: 0;
        }

        /* 單張經文卡片 */
        .verse-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .verse-header {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-weight: 600;
            color: var(--primary-color);
        }

        .verse-header:hover {
            background-color: #f1f4f8;
        }

        .verse-header::after {
            content: '+';
            font-size: 1.2rem;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .verse-card.active .verse-header::after {
            transform: rotate(45deg);
        }

        .verse-content {
            max-height: 0;
            overflow: hidden;
            background-color: var(--verse-bg);
            padding: 0 20px;
            transition: max-height 0.3s ease, padding 0.3s ease;
            font-size: 1.05rem;
            color: #444;
            white-space: pre-line;
        }

        .verse-card.active .verse-content {
            max-height: 500px;
            padding: 15px 20px 20px 20px;
            border-top: 1px solid #e1e8ed;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>腓立比書</h1>
            <p>點擊組別標題可摺疊/展開大組，點擊經節可查看內容</p>
        </header>

        <div class="controls">
            <button class="btn" id="expandAllBtn">全部展開</button>
            <button class="btn" id="collapseAllBtn">全部收合</button>
        </div>

        <div id="app"></div>
    </div>

    <script>
        const bibleData = [
            {
                group: "腓立比書 2:5-11",
                verses: [
                    { ref: "2:5", content: "你們當以基督耶穌的心為心。" },
                    { ref: "2:6", content: "他本有神的形象，不以自己與神同等為強奪的，" },
                    { ref: "2:7", content: "反倒虛己，取了奴僕的形象，成為人的樣式；" },
                    { ref: "2:8", content: "既有人的樣子，就自己卑微，存心順服以至於死，且死在十字架上。
                    { ref: "2:9", content: "所以神將他升為至高，又賜給他那超乎萬名之上的名，" },
                    { ref: "2:10", content: "叫一切在天上的、地上的和地底下的，因耶穌的名無不屈膝，" },
                    { ref: "2:11", content: "無不口稱耶穌基督為主，使榮耀歸於父神。" }
                ]
            },
                group: "腓立比書 4:6-7",
                verses: [
                    { ref: "4:6", content: "应当一无挂虑，只要凡事藉着祷告、祈求，和感谢，将你们所要的告诉神。" },
                    { ref: "4:7", content: "神那出人意外的平安必在基督耶稣里保守你们的心怀意念。" },
                ]
            }
        ];

        const appElement = document.getElementById('app');

        // 渲染畫面
        bibleData.forEach(section => {
            // 包覆每一組的外層容器
            const sectionContainer = document.createElement('div');
            sectionContainer.className = 'section-container';

            // 組別大標題
            const sectionHeader = document.createElement('h2');
            sectionHeader.className = 'section-header';
            sectionHeader.innerText = section.group;

            // 實際裝經節的容器
            const sectionBody = document.createElement('div');
            sectionBody.className = 'section-body';

            // 點擊組別標題以折疊/展開該組
            sectionHeader.addEventListener('click', () => {
                sectionContainer.classList.toggle('collapsed');
            });

            // 建立該組底下的所有經節卡片
            section.verses.forEach(item => {
                const card = document.createElement('div');
                card.className = 'verse-card';

                const header = document.createElement('div');
                header.className = 'verse-header';
                header.innerText = item.ref;

                const content = document.createElement('div');
                content.className = 'verse-content';
                content.innerText = item.content;

                // 點擊經節：切換展開/收合經文內容
                header.addEventListener('click', (e) => {
                    e.stopPropagation(); // 避免觸發父層的折疊事件
                    card.classList.toggle('active');
                });

                card.appendChild(header);
                card.appendChild(content);
                sectionBody.appendChild(card);
            });

            sectionContainer.appendChild(sectionHeader);
            sectionContainer.appendChild(sectionBody);
            appElement.appendChild(sectionContainer);
        });

        // 「全部展開」與「全部收合」按鈕功能
        document.getElementById('expandAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.section-container').forEach(el => {
                el.classList.remove('collapsed');
            });
        });

        document.getElementById('collapseAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.section-container').forEach(el => {
                el.classList.add('collapsed');
            });
        });
    </script>
</body>
</html>
