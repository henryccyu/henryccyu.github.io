<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經文背誦小幫手</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --verse-bg: #eef2f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        /* 控制按鈕列樣式 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid #cbd5e1;
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* 組別區塊樣式 */
        .section-container {
            margin-bottom: 20px;
        }

        .section-header {
            color: var(--primary-color);
            background-color: #e2e8f0;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            margin: 0 0 10px 0;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            user-select: none;
            transition: background-color 0.2s;
        }

        .section-header:hover {
            background-color: #cbd5e1;
        }

        .section-header::after {
            content: '▼';
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        .section-container.collapsed .section-header::after {
            transform: rotate(-90deg);
        }

        /* 經節清單容器動畫 */
        .section-body {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .section-container.collapsed .section-body {
            max-height: 0;
            opacity: 0;
        }

        /* 單張經文卡片 */
        .verse-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .verse-header {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-weight: 600;
            color: var(--primary-color);
        }

        .verse-header:hover {
            background-color: #f1f4f8;
        }

        .verse-header::after {
            content: '+';
            font-size: 1.2rem;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .verse-card.active .verse-header::after {
            transform: rotate(45deg);
        }

        .verse-content {
            max-height: 0;
            overflow: hidden;
            background-color: var(--verse-bg);
            padding: 0 20px;
            transition: max-height 0.3s ease, padding 0.3s ease;
            font-size: 1.05rem;
            color: #444;
            white-space: pre-line;
        }

        .verse-card.active .verse-content {
            max-height: 500px;
            padding: 15px 20px 20px 20px;
            border-top: 1px solid #e1e8ed;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>腓立比書</h1>
            <p>點擊組別標題可摺疊/展開大組，點擊經節可查看內容</p>
        </header>

        <div class="controls">
            <button class="btn" id="expandAllBtn">全部展開</button>
            <button class="btn" id="collapseAllBtn">全部收合</button>
        </div>

        <div id="app"></div>
    </div>

    <script>
        const bibleData = [
            {
                group: "I. Introduction (1:1–11)",
                verses: [
                    { ref: "1) Opening Greeting (1:1–2)", content: "1 基督耶稣的仆人保罗和提摩太，写信给凡住腓立比，在基督耶稣里的众圣徒和诸位监督、诸位执事。2 愿恩惠、平安从神我们的父并主耶稣基督归于你们！" },
                    { ref: "2) Thanksgiving (1:3–8)", content: "3 我每逢想念你们，就感谢我的神； 4 每逢为你们众人祈求的时候，常是欢欢喜喜地祈求。 5 因为从头一天直到如今，你们是同心合意地兴旺福音。 6 我深信那在你们心里动了善工的必成全这工，直到耶稣基督的日子。 7 我为你们众人有这样的意念原是应当的，因你们常在我心里，无论我是在捆锁之中，是辩明证实福音的时候，你们都与我一同得恩。 8 我体会基督耶稣的心肠，切切地想念你们众人，这是神可以给我作见证的。" },
                    { ref: "3) Prayer (1:9–11)", content: "9 我所祷告的，就是要你们的爱心在知识和各样见识上多而又多， 10 使你们能分别是非，做诚实无过的人，直到基督的日子； 11 并靠着耶稣基督结满了仁义的果子，叫荣耀称赞归于神。" }
                ]
            },
            {
                group: "2. Paul’s Chains Advance the Gospel (1:12–26)",
                verses: [
                    { ref: "1) The Results of Paul’s Imprisonment (1:12–14)", content: "12 弟兄们，我愿意你们知道，我所遭遇的事更是叫福音兴旺， 13 以致我受的捆锁在御营全军和其余的人中，已经显明是为基督的缘故； 14 并且那在主里的弟兄，多半因我受的捆锁就笃信不疑，越发放胆传神的道，无所惧怕。" },
                    { ref: "2) Paul’s Rivals (1:15–18)", content: "15 有的传基督是出于嫉妒纷争，也有的是出于好意。 16 这一等是出于爱心，知道我是为辩明福音设立的； 17 那一等传基督是出于结党，并不诚实，意思要加增我捆锁的苦楚。 18 这有何妨呢？或是假意，或是真心，无论怎样，基督究竟被传开了。为此我就欢喜，并且还要欢喜。" },
                    { ref: "3) Paul’s Confidence in Death and Life (1:19–26)", content: "19 因为我知道，这事借着你们的祈祷和耶稣基督之灵的帮助，终必叫我得救。 20 照着我所切慕、所盼望的，没有一事叫我羞愧，只要凡事放胆，无论是生是死，总叫基督在我身上照常显大。21 因我活着就是基督，我死了就有益处。 22 但我在肉身活着，若成就我工夫的果子，我就不知道该挑选什么。 23 我正在两难之间，情愿离世与基督同在，因为这是好得无比的； 24 然而我在肉身活着，为你们更是要紧的。 25 我既然这样深信，就知道仍要住在世间，且与你们众人同住，使你们在所信的道上又长进又喜乐， 26 叫你们在基督耶稣里的欢乐因我再到你们那里去，就越发加增。" }
                ]
            },
            {
                group: "詩篇 8",
                verses: [
                    { ref: "8:1", content: "耶和華我們的主啊，你的名在全地何其美，你將你的榮耀彰顯於天！" },
                    { ref: "8:2", content: "你因敵人的緣故，從嬰孩和吃奶的口中建立了能力，使仇敵和報仇的閉口無言。" },
                    { ref: "8:3", content: "我觀看你指頭所造的天，並你所陳設的月亮星宿，" },
                    { ref: "8:4", content: "便說：「人算什麼，你竟顧念他？世人算什麼，你竟眷顧他？" },
                    { ref: "8:5", content: "你叫他比天使微小一點，並賜他榮耀尊貴為冠冕。" },
                    { ref: "8:6-8", content: "你派他管理你手所造的，使萬物，就是一切的牛羊，田野的獸，空中的鳥，海裡的魚，凡經行海道的，都服在他的腳下。」" },
                    { ref: "8:9", content: "耶和華我們的主啊，你的名在全地何其美！" }
                ]
            }
        ];

        const appElement = document.getElementById('app');

        // 渲染畫面
        bibleData.forEach(section => {
            // 包覆每一組的外層容器
            const sectionContainer = document.createElement('div');
            sectionContainer.className = 'section-container';

            // 組別大標題
            const sectionHeader = document.createElement('h2');
            sectionHeader.className = 'section-header';
            sectionHeader.innerText = section.group;

            // 實際裝經節的容器
            const sectionBody = document.createElement('div');
            sectionBody.className = 'section-body';

            // 點擊組別標題以折疊/展開該組
            sectionHeader.addEventListener('click', () => {
                sectionContainer.classList.toggle('collapsed');
            });

            // 建立該組底下的所有經節卡片
            section.verses.forEach(item => {
                const card = document.createElement('div');
                card.className = 'verse-card';

                const header = document.createElement('div');
                header.className = 'verse-header';
                header.innerText = item.ref;

                const content = document.createElement('div');
                content.className = 'verse-content';
                content.innerText = item.content;

                // 點擊經節：切換展開/收合經文內容
                header.addEventListener('click', (e) => {
                    e.stopPropagation(); // 避免觸發父層的折疊事件
                    card.classList.toggle('active');
                });

                card.appendChild(header);
                card.appendChild(content);
                sectionBody.appendChild(card);
            });

            sectionContainer.appendChild(sectionHeader);
            sectionContainer.appendChild(sectionBody);
            appElement.appendChild(sectionContainer);
        });

        // 「全部展開」與「全部收合」按鈕功能
        document.getElementById('expandAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.section-container').forEach(el => {
                el.classList.remove('collapsed');
            });
        });

        document.getElementById('collapseAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.section-container').forEach(el => {
                el.classList.add('collapsed');
            });
        });
    </script>
</body>
</html>
