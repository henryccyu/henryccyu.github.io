<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經文背誦小幫手</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --verse-bg: #eef2f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        /* 控制按鈕列樣式 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid #cbd5e1;
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* 組別區塊樣式 */
        .section-container {
            margin-bottom: 20px;
        }

        .section-header {
            color: var(--primary-color);
            background-color: #e2e8f0;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            margin: 0 0 10px 0;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            user-select: none;
            transition: background-color 0.2s;
        }

        .section-header:hover {
            background-color: #cbd5e1;
        }

        .section-header::after {
            content: '▼';
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        .section-container.collapsed .section-header::after {
            transform: rotate(-90deg);
        }

        /* 經節清單容器動畫 */
        .section-body {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .section-container.collapsed .section-body {
            max-height: 0;
            opacity: 0;
        }

        /* 單張經文卡片 */
        .verse-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .verse-header {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-weight: 600;
            color: var(--primary-color);
        }

        .verse-header:hover {
            background-color: #f1f4f8;
        }

        .verse-header::after {
            content: '+';
            font-size: 1.2rem;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .verse-card.active .verse-header::after {
            transform: rotate(45deg);
        }

        .verse-content {
            max-height: 0;
            overflow: hidden;
            background-color: var(--verse-bg);
            padding: 0 20px;
            transition: max-height 0.3s ease, padding 0.3s ease;
            font-size: 1.05rem;
            color: #444;
            white-space: pre-line;
        }

        .verse-card.active .verse-content {
            max-height: 500px;
            padding: 15px 20px 20px 20px;
            border-top: 1px solid #e1e8ed;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>聖經經文</h1>
            <p>點擊組別標題可摺疊/展開大組，點擊經節可查看內容</p>
        </header>

        <div class="controls">
            <button class="btn" id="expandAllBtn">全部展開</button>
            <button class="btn" id="collapseAllBtn">全部收合</button>
        </div>

        <div id="app"></div>
    </div>

    <script>
        const bibleData = [
            {
                group: "詩篇 8",
                verses: [
                    { ref: "8:1 耶和華我們的主啊，你的名在全地何其美，你將你的榮耀彰顯於天！" },
                    { ref: "8:2 你因敵人的緣故，從嬰孩和吃奶的口中建立了能力，使仇敵和報仇的閉口無言。" },
                    { ref: "8:3 我觀看你指頭所造的天，並你所陳設的月亮星宿，" },
                    { ref: "8:4 便說：「人算什麼，你竟顧念他？世人算什麼，你竟眷顧他？" },
                    { ref: "8:5 你叫他比天使微小一點，並賜他榮耀尊貴為冠冕。" },
                    { ref: "8:6 你派他管理你手所造的，使萬物，就是一切的牛羊，田野的獸，空中的鳥，海裡的魚，凡經行海道的，都服在他的腳下。」" },
                    { ref: "8:9 耶和華我們的主啊，你的名在全地何其美！" }
                ]
            },
            {
                group: "詩篇 16",
                verses: [
                    { ref: "16:1", content:"神啊，求你保佑我，因為我投靠你。" },
                    { ref: "16:2", content:"我的心哪，你曾對耶和華說：「你是我的主，我的好處不在你以外。」" },
                    { ref: "16:3", content:"論到世上的聖民，他們又美又善，是我最喜悅的。" },
                    { ref: "16:4", content:"以別神代替耶和華的，他們的愁苦必加增。他們所澆奠的血我不獻上，我嘴唇也不提別神的名號。" },
                    { ref: "16:5", content:"耶和華是我的產業，是我杯中的份，我所得的你為我持守。" },
                    { ref: "16:6", content:"用繩量給我的地界坐落在佳美之處，我的產業實在美好！" },
                    { ref: "16:7", content:"我必稱頌那指教我的耶和華，我的心腸在夜間也警戒我。" },
                    { ref: "16:8", content:"我將耶和華常擺在我面前，因他在我右邊，我便不致搖動。" },
                    { ref: "16:9", content:"因此我的心歡喜，我的靈快樂，我的肉身也要安然居住。" },
                    { ref: "16:10", content:"因為你必不將我的靈魂撇在陰間，也不叫你的聖者見朽壞。" },
                    { ref: "16:11", content:"你必將生命的道路指示我，在你面前有滿足的喜樂，在你右手中有永遠的福樂。" }
                ]
            },
            {
                group: "詩篇 51",
                verses: [
                    { ref: "51:1", content: "神啊，求你按你的慈愛憐恤我，按你豐盛的慈悲塗抹我的過犯！" },
                    { ref: "51:2, content: "求你將我的罪孽洗除淨盡，並潔除我的罪！" },
                    { ref: "51:3, content: "因為我知道我的過犯，我的罪常在我面前。" },
                    { ref: "51:4, content: "我向你犯罪，唯獨得罪了你，在你眼前行了這惡，以致你責備我的時候顯為公義，判斷我的時候顯為清正。" },
                    { ref: "51:5, content: "我是在罪孽裡生的，在我母親懷胎的時候就有了罪。" },
                    { ref: "51:6, content: "你所喜愛的是內裡誠實，你在我隱密處必使我得智慧。" },
                    { ref: "51:7, content: "求你用牛膝草潔淨我，我就乾淨；求你洗滌我，我就比雪更白。" },
                    { ref: "51:8, content: "求你使我得聽歡喜快樂的聲音，使你所壓傷的骨頭可以踴躍。" },
                    { ref: "51:9, content: "求你掩面不看我的罪，塗抹我一切的罪孽。" },
                    { ref: "51:10, content: "神啊，求你為我造清潔的心，使我裡面重新有正直[a]的靈。" },
                    { ref: "51:11, content: "不要丟棄我，使我離開你的面，不要從我收回你的聖靈。" },
                    { ref: "51:12, content: "求你使我仍得救恩之樂，賜我樂意的靈扶持我。" },
                    { ref: "51:13, content: "我就把你的道指教有過犯的人，罪人必歸順你。" },
                    { ref: "51:14, content: "神啊，你是拯救我的神，求你救我脫離流人血的罪，我的舌頭就高聲歌唱你的公義。" },
                    { ref: "51:15, content: "主啊，求你使我嘴唇張開，我的口便傳揚讚美你的話。" },
                    { ref: "51:16, content: "你本不喜愛祭物，若喜愛，我就獻上，燔祭你也不喜悅。" },
                    { ref: "51:17, content: "神所要的祭就是憂傷的靈，神啊，憂傷痛悔的心，你必不輕看。" },
                    { ref: "51:18, content: "求你隨你的美意善待錫安，建造耶路撒冷的城牆。" },
                    { ref: "51:19, content: "那時，你必喜愛公義的祭和燔祭，並全牲的燔祭。那時，人必將公牛獻在你壇上。" }
                ]
            },
            {
                group: "詩篇 90",
                verses: [
                    { ref: "90:1", content :"主啊，你世世代代做我們的居所。" },
                    { ref: "90:2", content :"諸山未曾生出，地與世界你未曾造成，從亙古到永遠，你是神。" },
                    { ref: "90:3", content :"你使人歸於塵土，說：「你們世人要歸回。」" },
                    { ref: "90:4", content :"在你看來，千年如已過的昨日，又如夜間的一更。" },
                    { ref: "90:5", content :"你叫他們如水沖去，他們如睡一覺。早晨他們如生長的草，" },
                    { ref: "90:6", content :"早晨發芽生長，晚上割下枯乾。" },
                    { ref: "90:7", content :"我們因你的怒氣而消滅，因你的憤怒而驚惶。" },
                    { ref: "90:8", content :"你將我們的罪孽擺在你面前，將我們的隱惡擺在你面光之中。" },
                    { ref: "90:9", content :"我們經過的日子都在你震怒之下，我們度盡的年歲好像一聲嘆息。" },
                    { ref: "90:10", content :"我們一生的年日是七十歲，若是強壯可到八十歲，但其中所矜誇的不過是勞苦愁煩；轉眼成空，我們便如飛而去。" },
                    { ref: "90:11", content :"誰曉得你怒氣的權勢？誰按著你該受的敬畏曉得你的憤怒呢？" },
                    { ref: "90:12", content :"求你指教我們怎樣數算自己的日子，好叫我們得著智慧的心。" },
                    { ref: "90:13", content :"耶和華啊，我們要等到幾時呢？求你轉回，為你的僕人後悔。" },
                    { ref: "90:14", content :"求你使我們早早飽得你的慈愛，好叫我們一生一世歡呼喜樂。" },
                    { ref: "90:15", content :"求你照著你使我們受苦的日子和我們遭難的年歲，叫我們喜樂。" },
                    { ref: "90:16", content :"願你的作為向你僕人顯現，願你的榮耀向他們子孫顯明。" },
                    { ref: "90:17", content :"願主我們神的榮美歸於我們身上，願你堅立我們手所做的工——我們手所做的工，願你堅立！" }
                ]
            },
            {
                group: "詩篇 93",
                verses: [
                    { ref: "93:1", content: "耶和华作王，他以威严为衣；耶和华以威严为衣，以能力束腰，世界就得以坚立，永不动摇。" },
                    { ref: "93:2", content: "你的宝座自古就立定，你从亘古就存在。" },
                    { ref: "93:3", content: "耶和华啊！大水扬起了，大水扬起了声音，大水扬起了澎湃的波浪。" },
                    { ref: "93:4", content: "耶和华在高处大有能力，胜过大水的响声，胜过海中的巨浪。" },
                    { ref: "93:5", content: "耶和华啊！你的法度极为确定；你的殿永远被称为圣是合宜的。" }
                ]
            }
        ];

        const appElement = document.getElementById('app');

        // 渲染畫面
        bibleData.forEach(section => {
            // 包覆每一組的外層容器
            const sectionContainer = document.createElement('div');
            sectionContainer.className = 'section-container';

            // 組別大標題
            const sectionHeader = document.createElement('h2');
            sectionHeader.className = 'section-header';
            sectionHeader.innerText = section.group;

            // 實際裝經節的容器
            const sectionBody = document.createElement('div');
            sectionBody.className = 'section-body';

            // 點擊組別標題以折疊/展開該組
            sectionHeader.addEventListener('click', () => {
                sectionContainer.classList.toggle('collapsed');
            });

            // 建立該組底下的所有經節卡片
            section.verses.forEach(item => {
                const card = document.createElement('div');
                card.className = 'verse-card';

                const header = document.createElement('div');
                header.className = 'verse-header';
                header.innerText = item.ref;

                const content = document.createElement('div');
                content.className = 'verse-content';
                content.innerText = item.content;

                // 點擊經節：切換展開/收合經文內容
                header.addEventListener('click', (e) => {
                    e.stopPropagation(); // 避免觸發父層的折疊事件
                    card.classList.toggle('active');
                });

                card.appendChild(header);
                card.appendChild(content);
                sectionBody.appendChild(card);
            });

            sectionContainer.appendChild(sectionHeader);
            sectionContainer.appendChild(sectionBody);
            appElement.appendChild(sectionContainer);
        });

        // 「全部展開」與「全部收合」按鈕功能
        document.getElementById('expandAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.section-container').forEach(el => {
                el.classList.remove('collapsed');
            });
        });

        document.getElementById('collapseAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.section-container').forEach(el => {
                el.classList.add('collapsed');
            });
        });
    </script>
</body>
</html>
