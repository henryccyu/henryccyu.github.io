const appElement = document.getElementById("app");
function renderNode(nodeData, targetElement) {
    if (nodeData.ref !== undefined) {
        const verseCard = document.createElement("div"); verseCard.className = "verse-card";
        const verseHeader = document.createElement("div"); verseHeader.className = "verse-header"; verseHeader.textContent = nodeData.ref;
        const verseContent = document.createElement("div"); verseContent.className = "verse-content"; verseContent.textContent = nodeData.content;
        verseHeader.addEventListener("click", (e) => { e.stopPropagation(); verseCard.classList.toggle("active"); });
        verseCard.appendChild(verseHeader); verseCard.appendChild(verseContent); targetElement.appendChild(verseCard);
    } else if (nodeData.title) {
        const container = document.createElement("div"); container.className = "level-container";
        const header = document.createElement("div"); header.className = "level-header"; header.textContent = nodeData.title;
        const body = document.createElement("div"); body.className = "collapsible-body";
        header.addEventListener("click", (e) => { e.stopPropagation(); container.classList.toggle("active"); });
        container.appendChild(header);
        if (nodeData.children && Array.isArray(nodeData.children)) { nodeData.children.forEach(child => renderNode(child, body)); }
        container.appendChild(body); targetElement.appendChild(container);
    }
}
rawData.forEach(item => renderNode(item, appElement));
document.getElementById("expandAllBtn").addEventListener("click", () => {
    document.querySelectorAll(".level-container").forEach(el => el.classList.add("active"));
    document.querySelectorAll(".verse-card").forEach(el => el.classList.add("active"));
});
document.getElementById("collapseAllBtn").addEventListener("click", () => {
    document.querySelectorAll(".level-container").forEach(el => el.classList.remove("active"));
    document.querySelectorAll(".verse-card").forEach(el => el.classList.remove("active"));
});
</script>
