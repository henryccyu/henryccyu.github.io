<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經文背誦小幫手</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --verse-bg: #eef2f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        /* 控制按鈕列樣式 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid #cbd5e1;
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* 組別區塊樣式 */
        .section-container {
            margin-bottom: 20px;
        }

        .section-header {
            color: var(--primary-color);
            background-color: #e2e8f0;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            margin: 0 0 10px 0;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            user-select: none;
            transition: background-color 0.2s;
        }

        .section-header:hover {
            background-color: #cbd5e1;
        }

        .section-header::after {
            content: '▼';
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        .section-container.collapsed .section-header::after {
            transform: rotate(-90deg);
        }

        /* 經節清單容器動畫 */
        .section-body {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 1;
        }

        .section-container.collapsed .section-body {
            max-height: 0;
            opacity: 0;
        }

        /* 單張經文卡片 */
        .verse-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .verse-header {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-weight: 600;
            color: var(--primary-color);
        }

        .verse-header:hover {
            background-color: #f1f4f8;
        }

        .verse-header::after {
            content: '+';
            font-size: 1.2rem;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .verse-card.active .verse-header::after {
            transform: rotate(45deg);
        }

        .verse-content {
            max-height: 0;
            overflow: hidden;
            background-color: var(--verse-bg);
            padding: 0 20px;
            transition: max-height 0.3s ease, padding 0.3s ease;
            font-size: 1.05rem;
            color: #444;
            white-space: pre-line;
        }

        .verse-card.active .verse-content {
            max-height: 500px;
            padding: 15px 20px 20px 20px;
            border-top: 1px solid #e1e8ed;
        }
    </style>
</head>

            <button class="btn" id="expandAllBtn">全部展開</button>

        </div>

                    { ref: "48. 林前15:58", content: "所以我親愛的弟兄們，你們務要堅固不可搖動，常常竭力多作主工；因為知道你們的勞苦，在主裡面不是徒然的。" }
                ]
            },
            {
                group: "十三、",
                verses: [
                    { ref: "49. 約壹2:17", content: "這世界和其上的情欲都要過去，惟獨遵行神旨意的，是永遠常存。" },
                    { ref: "50. 詩37:1-2", content: "不要為作惡的心懷不平，也不要向那行不義的生出嫉妒。因為他們如草快被割下，又如青菜快要枯乾。" },
                    { ref: "51. 詩37:35-36", content: "我見過惡人大有勢力，好像一棵青翠樹在本土生發。有人從那裡經過，不料，他沒有了；我也尋找他，卻尋不著。" }
                ]
            },
            {
                group: "十四、",
                verses: [
                    { ref: "52. 詩51:5", content: "我是在罪孽裡生的，在我母親懷胎的時候就有了罪。" },
                    { ref: "53. 詩58:3", content: "惡人一出母胎就與神疏遠，一離母腹，便走錯路，說謊話。" },
                    { ref: "54. 太15:13-14", content: "耶穌回答說：「凡栽種的物，若不是我天父栽種的，必要拔出來，任憑他們吧！他們是瞎眼領路的，若是瞎子領瞎子，兩個人都要掉在坑裡。」" },
                    { ref: "55. 羅1:28", content: "他們既然故意不認識神，神就任憑他們存邪僻的心，行那些不合理的事。" }
                ]
            },
            {
                group: "十五、",
                verses: [
                    { ref: "56. 賽43:7", content: "就是凡稱為我名下的人，是我為自己的榮耀創造的，是我所作成，所造作的。" },
                    { ref: "57. 羅5:6-8", content: "因我們還軟弱的時候，基督就按所定的日期為罪人死。為義人死，是少有的；為仁人死，或者有敢作的，惟有基督在我們還作罪人的時候，為我們死，神的愛就在此向我們顯明了。" },
                    { ref: "58. 詩90:12", content: "求你指教我們怎樣數算自己的日子，好叫我們得著智慧的心。" }
                ]
            },
            {
                group: "十六、",
                verses: [
                    { ref: "59. 羅6:23", content: "因為罪的工價乃是死，惟有神的恩賜，在我們的主基督耶穌裡，乃是永生。" },
                    { ref: "60. 徒4:12", content: "除祂以外，別無拯救，因為在天下人間，沒有賜下別的名，我們可以靠著得救。」" },
                    { ref: "61. 羅3:25", content: "神設立耶穌作挽回祭，是憑著耶穌的血，藉著人的信，要顯明神的義；因為祂用忍耐的心，寬容人先時所犯的罪。" },
                    { ref: "62. 林前3:13", content: "各人的工程必然顯露，因為那日子要將它表明出來；有火發現，這火要試驗各人的工程怎樣。" },
                    { ref: "63. 彼前5:7", content: "你們要將一切的憂慮卸給神，因為祂顧念你們。" }
                ]
            },
            {
                group: "十七、",
                verses: [
                    { ref: "64. 詩68:19", content: "天天背負我們重擔的主，就是拯救我們的神，是應當稱頌的！" },
                    { ref: "65. 約16:33", content: "我將這些事告訴你們，是要叫你們在我裡面有平安；在世上，你們有苦難，但你們可以放心，我已經勝了世界。」" },
                    { ref: "66. 賽65:2", content: "我整天伸手招呼那悖逆的百姓；他們隨自己的意念行不善之道。" },
                    { ref: "67. 羅3:10-12", content: "就如經上所記：「沒有義人，連一個也沒有。沒有明白的；沒有尋求神的；都是偏離正路，一同變為無用。沒有行善的，連一個也沒有。」" }
                ]
            }
        ];

        const appElement = document.getElementById('app');

        // 渲染畫面
        bibleData.forEach(section => {
            // 包覆每一組的外層容器
            const sectionContainer = document.createElement('div');
            sectionContainer.className = 'section-container';

            // 組別大標題
            const sectionHeader = document.createElement('h2');
            sectionHeader.className = 'section-header';
            sectionHeader.innerText = section.group;

            // 實際裝經節的容器
            const sectionBody = document.createElement('div');
            sectionBody.className = 'section-body';

            // 點擊組別標題以折疊/展開該組
            sectionHeader.addEventListener('click', () => {
                sectionContainer.classList.toggle('collapsed');
            });

            // 建立該組底下的所有經節卡片
            section.verses.forEach(item => {
                const card = document.createElement('div');
                card.className = 'verse-card';

                const header = document.createElement('div');
                header.className = 'verse-header';
                header.innerText = item.ref;

                const content = document.createElement('div');
                content.className = 'verse-content';
                content.innerText = item.content;

                // 點擊經節：切換展開/收合經文內容
                header.addEventListener('click', (e) => {
                    e.stopPropagation(); // 避免觸發父層的折疊事件
                    card.classList.toggle('active');
                });

                card.appendChild(header);
                card.appendChild(content);
                sectionBody.appendChild(card);
            });

            sectionContainer.appendChild(sectionHeader);
            sectionContainer.appendChild(sectionBody);
            appElement.appendChild(sectionContainer);
        });

        // 「全部展開」與「全部收合」按鈕功能
        document.getElementById('expandAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.section-container').forEach(el => {
                el.classList.remove('collapsed');
            });
        });

        document.getElementById('collapseAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.section-container').forEach(el => {
                el.classList.add('collapsed');
            });
        });
    </script>
</body>
</html>
