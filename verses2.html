<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經經文小幫手</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --verse-bg: #eef2f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        .section-title {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 5px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .verse-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .verse-header {
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            font-weight: 600;
            color: var(--primary-color);
        }

        .verse-header:hover {
            background-color: #f1f4f8;
        }

        .verse-header::after {
            content: '+';
            font-size: 1.2rem;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .verse-card.active .verse-header::after {
            transform: rotate(45deg);
        }

        .verse-content {
            max-height: 0;
            overflow: hidden;
            background-color: var(--verse-bg);
            padding: 0 20px;
            transition: max-height 0.3s ease, padding 0.3s ease;
            font-size: 1.05rem;
            color: #444;
            white-space: pre-line;
        }

        .verse-card.active .verse-content {
            max-height: 500px;
            padding: 15px 20px 20px 20px;
            border-top: 1px solid #e1e8ed;
        }
    </style>
</head>

                    { ref: "67. 羅3:10-12", content: "就如經上所記：「沒有義人，連一個也沒有。沒有明白的；沒有尋求神的；都是偏離正路，一同變為無用。沒有行善的，連一個也沒有。」" }

        ];

        // 渲染畫面
        const appElement = document.getElementById('app');

        bibleDataforEach = bibleData.forEach(section => {
            // 建立群組標題
            const sectionTitle = document.createElement('h2');
            sectionTitle.className = 'section-title';
            sectionTitle.innerText = section.group;
            appElement.appendChild(sectionTitle);

            // 建立該群組底下的經節清單
            section.verses.forEach(item => {
                const card = document.createElement('div');
                card.className = 'verse-card';

                const header = document.createElement('div');
                header.className = 'verse-header';
                header.innerText = item.ref;

                const content = document.createElement('div');
                content.className = 'verse-content';
                content.innerText = item.content;

                // 點擊事件：切換展開/收合
                header.addEventListener('click', () => {
                    card.classList.toggle('active');
                });

                card.appendChild(header);
                card.appendChild(content);
                appElement.appendChild(card);
            });
        });
    </script>
</body>
</html>
